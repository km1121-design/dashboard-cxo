name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一ブランチで新しいプッシュがあれば古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test -- --ci

      - name: 本番ビルド
        run: npm run build
